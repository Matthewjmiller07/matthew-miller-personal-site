# Sends the newsletter named in writing/newsletter/send.json through Gmail SMTP.
# Needs repo secrets GMAIL_USER and GMAIL_APP_PASSWORD.
name: Newsletter — send

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'writing/newsletter/send.json'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/newsletter/send.py
