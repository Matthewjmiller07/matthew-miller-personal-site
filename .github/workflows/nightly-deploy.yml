# One production deploy a night, from midnight Israel time, and only when main has changed.
#
# Pushes to main don't deploy on their own (scripts/netlify/ignore-build.sh skips them to save
# Netlify credits: 15 per production deploy). This workflow calls a Netlify build hook, which the
# ignore script lets through, so the night's commits all go live in one deploy.
#
# It skips the deploy when the live site already serves main's latest commit (the build writes
# /build-info.json with the commit it was built from), so quiet days cost nothing.
#
# Setup: Netlify > Site configuration > Build & deploy > Build hooks > Add build hook (branch
# main), then save its URL as the repo secret NETLIFY_BUILD_HOOK.
# Run it by hand from the Actions tab ("Run workflow") to deploy now.
name: Nightly deploy

on:
  schedule:
    # GitHub cron is UTC. Midnight in Israel is 21:00 UTC in summer (IDT) and 22:00 UTC in
    # winter (IST), so both run. GitHub often starts scheduled runs hours late, so the first step
    # accepts anything from 00:00 to 05:59 Israel time; if both crons land in that window, the
    # second sees the live site already on main and skips.
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is it midnight in Israel?
        id: when
        run: |
          hour=$(TZ=Asia/Jerusalem date +%H)
          echo "Israel time: $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" -lt 6 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not between midnight and 6am in Israel (the other cron covers the other half of the year): skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Has main changed since the live deploy?
        id: diff
        if: steps.when.outputs.go == 'true'
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          live=$(curl -fsSL "https://theothermatthewmiller.com/build-info.json?t=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' || true)
          echo "main: $head"
          echo "live: ${live:-unknown}"
          if [ -n "$live" ] && [ "$live" = "$head" ]; then
            echo "The live site is already on main's latest commit: nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Netlify build hook
        if: steps.when.outputs.go == 'true' && steps.diff.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Repo secret NETLIFY_BUILD_HOOK is missing, so main is not deploying. See the setup note at the top of this workflow."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=Nightly+deploy"
          echo "Deploy triggered."
