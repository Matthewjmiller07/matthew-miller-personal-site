# Checks that given site URLs are live (HTTP status, type, size). Manual, or on pushes that
# change this file on a feature branch. Never runs on main, so it never costs a Netlify deploy.
name: Site check

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check URLs
        run: |
          for u in \
            https://theothermatthewmiller.com/newsletter/2026-10-12/trailer.mp4 \
            https://theothermatthewmiller.com/newsletter/2026-10-12/ \
            https://theothermatthewmiller.com/newsletter/2026-10-12/whatsapp-status.mp4 \
            https://theothermatthewmiller.com/ ; do
            curl -sS -o /dev/null -I -L -w "%{http_code}  %{content_type}  %{size_download}  $u\n" "$u" || echo "FAILED  $u"
          done
