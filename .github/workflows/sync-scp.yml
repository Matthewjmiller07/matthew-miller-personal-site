name: Sync SCP from Google Drive

on:
  # Run at midnight and 9am daily
  schedule:
    - cron: '0 0,9 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Sync SCP files from Drive
        env:
          GOOGLE_DRIVE_SCP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_SCP_FOLDER_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SOFER_AI_API_KEY: ${{ secrets.SOFER_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/sync-scp-drive.js
      
      - name: Check for changes
        id: check-changes
        run: |
          git add src/data/scp.json src/data/scp-*-transcript.json public/scp/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new shiurim detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New shiurim detected!"
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "🎧 Auto-sync SCP shiurim from Google Drive - Added/updated shiurim files, updated scp.json catalog"
          git pull --rebase origin main
          git push
      
      - name: Summary
        run: |
          if [ "${{ steps.check-changes.outputs.changed }}" == "true" ]; then
            echo "✅ New shiurim synced and committed! Netlify will auto-deploy."
          else
            echo "⏭️ No new shiurim to sync."
          fi
