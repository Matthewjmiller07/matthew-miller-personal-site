name: token-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect token shape (no value printed)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "len=${#CLAUDE_CODE_OAUTH_TOKEN}"
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat01-*) echo "shape=sk-ant-oat01" ;;
            sk-ant-*) echo "shape=other-sk-ant" ;;
            "") echo "shape=empty" ;;
            *) echo "shape=other" ;;
          esac
          if [ "$CLAUDE_CODE_OAUTH_TOKEN" = "$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')" ]; then
            echo "whitespace=clean"
          else
            echo "whitespace=HAS-WHITESPACE"
          fi
          env | grep -oE '^ANTHROPIC[A-Z_]*' | sort || true
      - name: CLI version
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
      - name: Minimal auth probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Reply with the single word OK." --output-format json 2>&1 | head -c 600
