name = "mega-bible-api"
main = "index.js"
compatibility_date = "2024-01-01"

# ── Auth mode ─────────────────────────────────────────────────────────────────
# "public"  → anyone can use the API, no key needed (good for sharing your work)
# "private" → requires X-API-Key header (you only)
# Switch anytime and redeploy — takes ~10 seconds
[vars]
API_MODE = "public"

# ── Domain routing ────────────────────────────────────────────────────────────
# Routes all /api/bible/* requests on your domain to this Worker.
# Your existing site handles everything else normally.
# Replace "theothermatthewmiller.com" with your actual zone if different.
routes = [
  { pattern = "theothermatthewmiller.com/api/bible/*", zone_name = "theothermatthewmiller.com" }
]

# ── Secret key (private mode only) ───────────────────────────────────────────
# Run this once to set your secret — never put it in this file:
#   wrangler secret put API_SECRET_KEY
# Then set API_MODE = "private" above and redeploy.
