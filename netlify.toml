[build]
  command = "node -e \"const fs = require('fs'); if(process.env.GOOGLE_CREDENTIALS) fs.writeFileSync('google-credentials.json', process.env.GOOGLE_CREDENTIALS); fs.writeFileSync('public/build-info.json', JSON.stringify({commit: process.env.COMMIT_REF || '', context: process.env.CONTEXT || '', built: new Date().toISOString()}));\" && npm install --legacy-peer-deps && npm run sync:scp && node scripts/extract-pdf-links.mjs && node scripts/build-search-index.mjs && node scripts/fetch-israel-stats.mjs && astro build"
  publish = "dist"
  # Saves credits: pushes to main don't deploy; .github/workflows/nightly-deploy.yml deploys at
  # midnight Israel time if main changed. A commit saying [deploy] deploys at once. See the script.
  ignore = "bash scripts/netlify/ignore-build.sh"

[[headers]]
  for = "/zmanim-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/desk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/desk/all.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[redirects]]
  from = "/parsha"
  to = "/parasha"
  status = 301

[[redirects]]
  from = "/parsha/*"
  to = "/parasha/:splat"
  status = 301

[[redirects]]
  from = "/api/bible"
  to = "/.netlify/functions/bible"
  status = 200

[[redirects]]
  from = "/api/bible/*"
  to = "/.netlify/functions/bible"
  status = 200

[functions]
  included_files = [
    "node_modules/node-html-parser/**",
    "public/images/Sukkah Posters/**",
    "public/aviya.csv",
    "google-credentials.json"
  ]
