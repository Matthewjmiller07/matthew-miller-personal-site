[build]
  command = "npm install --legacy-peer-deps && npm run sync:scp && node scripts/extract-pdf-links.mjs && node scripts/build-search-index.mjs && astro build"
  publish = "dist"

[[headers]]
  for = "/zmanim-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/javascript; charset=utf-8"

[functions]
  timeout = 26
  included_files = [
    "node_modules/node-html-parser/**",
    "public/images/Sukkah Posters/**",
    "public/aviya.csv"
  ]
