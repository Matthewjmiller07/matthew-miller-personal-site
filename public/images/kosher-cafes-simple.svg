<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Map Icon -->
  <circle cx="600" cy="200" r="60" fill="#ffffff" opacity="0.2"/>
  <path d="M600 160 L580 200 L600 240 L620 200 Z" fill="#ffffff"/>
  <circle cx="600" cy="200" r="15" fill="#1e40af"/>
  
  <!-- Main Title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Tel Aviv Kosher Cafes
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#ffffff" opacity="0.9">
    84+ Certified Kosher Coffee Shops
  </text>
  
  <!-- Map pins illustration -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="300" cy="450" r="8"/>
    <circle cx="450" cy="470" r="8"/>
    <circle cx="600" cy="460" r="8"/>
    <circle cx="750" cy="480" r="8"/>
    <circle cx="900" cy="450" r="8"/>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff" opacity="0.8">
    Interactive Map • Filter by Kashrut • Full Addresses
  </text>
</svg>
