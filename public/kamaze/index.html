<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kama Ze · Ra'anana grocery prices</title>
  <meta name="description" content="Compare real shelf prices at every Shufersal branch in Ra'anana. Scan a barcode, audit a receipt, price your whole list, send it to WhatsApp. Works offline.">
  <meta name="theme-color" content="#0b6b53" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10201b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/kamaze/manifest.webmanifest">
  <link rel="icon" href="/kamaze/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/kamaze/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kama Ze">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="Kama Ze · כמה זה">
  <meta property="og:description" content="Ra'anana grocery prices, straight from the stores' own price files.">
  <meta property="og:image" content="https://theothermatthewmiller.com/kamaze/icons/icon-512.png">
  <meta property="og:url" content="https://theothermatthewmiller.com/kamaze/">
  <link rel="stylesheet" href="/kamaze/styles.css">
  <link rel="modulepreload" href="/kamaze/i18n.js">
  <link rel="modulepreload" href="/kamaze/charts.js">
</head>
<body>
  <header class="top">
    <a class="brand" href="/kamaze/" aria-label="Kama Ze">
      <img src="/kamaze/icons/icon.svg" alt="" width="36" height="36">
      <span><b>Kama Ze <span lang="he" dir="rtl">כמה זה</span></b><small id="tagline">Ra'anana grocery prices</small></span>
    </a>
    <div class="top-actions">
      <button id="installBtn" class="btn sm" data-act="install" hidden>Install</button>
      <a id="whyLink" class="link" href="/kamaze/why/">Why Kama Ze</a>
      <button id="langBtn" class="btn sm ghost" data-act="lang">עברית</button>
    </div>
  </header>
  <p id="offline" class="offline" hidden></p>
  <main id="main"><div class="card center"><div class="spinner"></div><p>Loading prices</p></div></main>
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p style="padding:16px">Kama Ze needs JavaScript to compare prices.</p></noscript>
  <script type="module" src="/kamaze/app.js"></script>
</body>
</html>
