<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>OG Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; }
        .og-card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #374151;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
            color: white;
        }
        .og-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(34, 211, 238, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(251, 146, 60, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(250, 204, 21, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .header { position: relative; z-index: 1; }
        .title { font-size: 64px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; background: linear-gradient(135deg, #facc15 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { font-size: 28px; font-weight: 500; color: #d1d5db; max-width: 800px; line-height: 1.3; }
        .meta { position: relative; z-index: 1; display: flex; align-items: center; gap: 30px; }
        .badge { background: rgba(250, 204, 21, 0.15); color: #facc15; padding: 8px 16px; border-radius: 20px; font-size: 18px; font-weight: 600; border: 1px solid rgba(250, 204, 21, 0.3); }
        .site { color: #9ca3af; font-size: 20px; font-weight: 500; }
        .glows {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .glow {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }
        .glow-1 { background: #22d3ee; top: -100px; right: -50px; }
        .glow-2 { background: #f97316; bottom: -120px; left: -80px; }
        .glow-3 { background: #facc15; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.2; }
    </style>
</head>
<body>
    <div class="og-card">
        <div class="glows">
            <div class="glow glow-1"></div>
            <div class="glow glow-2"></div>
            <div class="glow glow-3"></div>
        </div>
        <div class="header">
            <h1 class="title">ChatGPT vs Claude</h1>
            <p class="subtitle">Plugin War Room: GTM arsenal to dismantle Claude Plugins and win enterprise deals</p>
        </div>
        <div class="meta">
            <div class="badge">GTM Arsenal</div>
            <div class="site">theothermatthewmiller.com</div>
        </div>
    </div>
</body>
</html>
