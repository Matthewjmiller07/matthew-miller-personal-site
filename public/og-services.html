<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>OG Preview - Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; }
        .og-card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #1e293b 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 64px;
            color: white;
        }
        .glows {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
        }
        .glow-1 { width: 400px; height: 400px; background: #6366f1; top: -150px; right: -80px; opacity: 0.35; }
        .glow-2 { width: 350px; height: 350px; background: #7c3aed; bottom: -120px; left: -60px; opacity: 0.3; }
        .glow-3 { width: 280px; height: 280px; background: #06b6d4; top: 40%; left: 55%; opacity: 0.2; }
        .header { position: relative; z-index: 1; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }
        .title {
            font-size: 68px;
            font-weight: 800;
            line-height: 1.08;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 50%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 26px;
            font-weight: 400;
            color: #94a3b8;
            max-width: 780px;
            line-height: 1.45;
        }
        .footer {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pills {
            display: flex;
            gap: 12px;
        }
        .pill {
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 17px;
            font-weight: 600;
        }
        .pill-ai { background: rgba(99, 102, 241, 0.25); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.35); }
        .pill-g2 { background: rgba(124, 58, 237, 0.25); color: #c4b5fd; border: 1px solid rgba(124, 58, 237, 0.35); }
        .pill-web { background: rgba(6, 182, 212, 0.2); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.3); }
        .site {
            color: #64748b;
            font-size: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="og-card">
        <div class="glows">
            <div class="glow glow-1"></div>
            <div class="glow glow-2"></div>
            <div class="glow glow-3"></div>
        </div>
        <div class="header">
            <div class="eyebrow">Former G2 Principal Analyst · AI &amp; Automation</div>
            <h1 class="title">Services by<br>Matthew Miller</h1>
            <p class="subtitle">AI training, G2 positioning strategy, and custom web development — built on insider expertise.</p>
        </div>
        <div class="footer">
            <div class="pills">
                <div class="pill pill-ai">🤖 AI Training</div>
                <div class="pill pill-g2">📊 G2 &amp; AEO Strategy</div>
                <div class="pill pill-web">🌐 Web Development</div>
            </div>
            <div class="site">theothermatthewmiller.com</div>
        </div>
    </div>
</body>
</html>
