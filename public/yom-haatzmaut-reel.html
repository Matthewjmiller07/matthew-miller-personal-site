<style>
  @font-face {
    font-family: 'Brand';

  html, body { margin: 0; padding: 0; background: #0b1020; font-family: Inter, system-ui, sans-serif; overflow: hidden; height: 100%; }
  * { box-sizing: border-box; }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 800px at 50% 40%, #1a2340 0%, #0b1020 60%, #050814 100%);
  }
  .carousel-wrap {
    position: relative;
  }
  .carousel-viewport {
    position: relative; width: 1080px; height: 1920px;
    overflow: hidden;
    border-radius: 36px;
    box-shadow:
      0 40px 120px rgba(0,0,0,0.5),
      0 8px 30px rgba(0,0,0,0.3),
      inset 0 0 0 8px rgba(255,255,255,0.06);
    background: #000;
  }
  .track {
    position: absolute; inset: 0;
    display: flex;
    transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .slide { flex: 0 0 1080px; height: 1920px; }

  .nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #F5F1E8;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 28px;
    transition: all 200ms;
    z-index: 10;
  }
  .nav:hover { background: rgba(255,255,255,0.16); transform: translateY(-50%) scale(1.05); }
  .nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav.prev { left: -110px; }
  .nav.next { right: -110px; }

  .dots {
    position: absolute;
    bottom: -60px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
    z-index: 10;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer; transition: all 200ms;
    border: none; padding: 0;
  }
  .dot.active { background: #F5F1E8; width: 32px; border-radius: 6px; }
  .dot:hover { background: rgba(255,255,255,0.5); }

  .meta {
    position: fixed; top: 24px; left: 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,232,0.5);
    letter-spacing: 2px; text-transform: uppercase;
    z-index: 20;

// ── App shell ────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'yom-reel-idx';

function useScaleToFit(baseW, baseH, pad = 80) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const onResize = () => {
      const availW = window.innerWidth - pad * 2;
      const availH = window.innerHeight - pad * 2;
      setScale(Math.min(availW / baseW, availH / baseH, 1));
    };
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [baseW, baseH, pad]);
  return scale;
}

function App() {
  const total = SLIDES.length;
  const [idx, setIdx] = React.useState(() => {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
    return isNaN(saved) ? 0 : Math.max(0, Math.min(saved, total - 1));
  });
  React.useEffect(() => {
    localStorage.setItem(STORAGE_KEY, String(idx));
  }, [idx]);

  const scale = useScaleToFit(1080, 1920, 120);

  const go = (n) => setIdx(Math.max(0, Math.min(total - 1, n)));
  const next = () => go(idx + 1);
  const prev = () => go(idx - 1);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { next(); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { prev(); e.preventDefault(); }
      if (e.key === 'Home') go(0);
      if (e.key === 'End') go(total - 1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx, total]);

  const touchRef = React.useRef({});
  const onTouchStart = (e) => { touchRef.current.x = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    const dx = e.changedTouches[0].clientX - (touchRef.current.x || 0);
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
  };

  return (
    <>
      <div className="meta">Yom Haatzmaut · 5786 · Reel/Story 1080×1920</div>
      <div className="counter">{String(idx+1).padStart(2,'0')} / {String(total).padStart(2,'0')}</div>
      <div className="hint">← → arrows · swipe · click dots</div>

      <div className="stage">
        <div className="carousel-wrap" style={{
          transform: `scale(${scale})`,
          transformOrigin: 'center',
        }}>
          <div className="carousel-viewport" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            <div className="track" style={{ transform: `translateX(-${idx * 1080}px)`, width: total * 1080 }}>
              {SLIDES.map((S, i) => (
                <div key={i} className="slide">
                  <S idx={i} total={total}/>
                </div>
              ))}
            </div>
          </div>

          <button className="nav prev" onClick={prev} disabled={idx === 0} aria-label="Previous">←</button>
          <button className="nav next" onClick={next} disabled={idx === total - 1} aria-label="Next">→</button>

          <div className="dots">
            {SLIDES.map((_, i) => (
              <button key={i} className={`dot ${i === idx ? 'active' : ''}`} onClick={() => go(i)} aria-label={`Go to slide ${i+1}`}/>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
