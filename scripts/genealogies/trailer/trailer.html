<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
:root{--gold:#f4c46a;--sky:#9ec5f4;--blue:#3987e5;--orange:#d95926;--aqua:#199e70;--yellow:#c98500;--ink:#07070a;--paper:#efe6d2;--mute:#9a94a6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:var(--ink)}
#bg{position:absolute;inset:0}#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.6);padding:0 calc(var(--u)*6)}
.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;unicode-bidi:isolate;font-weight:900;line-height:1.1}
.disp{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:.95}
.en{font-family:'Inter',sans-serif;color:var(--paper);font-weight:700}
.gold{color:var(--gold)}.sky{color:var(--sky)}.mute{color:var(--mute)}.paper{color:var(--paper)}
.glow{text-shadow:0 0 calc(var(--u)*5) rgba(244,196,106,.55),0 0 4px rgba(255,223,158,.5)}
.glows{text-shadow:0 0 calc(var(--u)*5) rgba(158,197,244,.55)}
.k{font-family:'Oswald',sans-serif;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);font-size:calc(var(--u)*3.2)}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.gen{display:flex;flex-direction:column;gap:calc(var(--u)*.55);width:min(100%,calc(var(--u)*86))}
.gen .r{display:grid;grid-template-columns:1fr auto;align-items:center;gap:calc(var(--u)*2)}
.gen .r .bar{height:calc(var(--u)*1.5);border-radius:4px;background:var(--gold);transform-origin:left center}
.gen .r .lab{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*2)}
.gen .r .lab .he{font-size:calc(var(--u)*3.9);color:var(--paper)}
.gen .r .lab .disp{font-size:calc(var(--u)*3.4);color:var(--sky)}
.g10{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:calc(var(--u)*1.4) calc(var(--u)*3);direction:rtl;width:min(100%,calc(var(--u)*150))}
.g10 .c{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.4);padding:calc(var(--u)*1.2) 0;border-top:1px solid rgba(244,196,106,.25)}
.g10 .he{font-size:calc(var(--u)*5.4);color:var(--paper)}
.g10 .disp{font-size:calc(var(--u)*4.4);color:var(--gold)}
.cloud{position:relative;width:100%;height:100%}
.cloud .he{position:absolute;color:var(--paper);transform-origin:center}
.bars3{display:flex;align-items:flex-end;gap:calc(var(--u)*5);height:calc(var(--u)*34)}
.bars3 .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--u)*1);height:100%}
.bars3 .b .fill{width:calc(var(--u)*13);border-radius:6px 6px 0 0;transform-origin:bottom}
.bars3 .b .v{font-family:'Oswald';font-weight:700;font-size:calc(var(--u)*5.2);color:var(--paper)}
.bars3 .b .l{font-family:'Oswald';letter-spacing:.2em;text-transform:uppercase;font-size:calc(var(--u)*2.6);color:var(--mute)}
body.v .gen{gap:calc(var(--u)*1.4)}
body.v .gen .r .lab .he{font-size:calc(var(--u)*5.6)}
body.v .gen .r .lab .disp{font-size:calc(var(--u)*4.6)}
body.v .gen .r .bar{height:calc(var(--u)*2)}
body.v .g10 .he{font-size:calc(var(--u)*7)}
body.v .g10 .disp{font-size:calc(var(--u)*5.6)}
body:not(.v) .gen{gap:calc(var(--u)*.2)}
svg.sp{width:calc(var(--u)*80);height:calc(var(--u)*26);overflow:visible}
</style></head><body>
<canvas id="bg"></canvas><div id="stage"></div>
<script>
const V=location.search.includes('v=vertical');
const W=V?1080:1920,H=V?1920:1080;
document.documentElement.style.setProperty('--u',(Math.min(W,H)/100)+'px');document.documentElement.style.setProperty('--cols',V?2:5);
if(V)document.body.classList.add('v');
for(const e of [document.documentElement,document.body]){e.style.width=W+'px';e.style.height=H+'px'}
const cv=document.getElementById('bg');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
const stage=document.getElementById('stage');
</script>
<script src="engine.js"></script>
<script>
const ND=window.ND; // names data, injected by render.mjs
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=Array.from({length:220},()=>({x:rnd(),y:rnd(),v:.01+rnd()*.04,r:.7+rnd()*2.6,ph:rnd()*6.28,w:rnd()}));
const MOOD={g:[244,196,106],s:[158,197,244],w:[57,135,229],o:[217,89,38],n:[180,160,200]};
function moodAt(t){for(let i=0;i<S.length;i++){const sc=S[i];if(t>=sc.start&&t<sc.start+sc.dur){
  const cur=MOOD[sc.mood],prev=i?MOOD[S[i-1].mood]:cur;const k=Math.min(1,(t-sc.start)/.6);const e=k*k*(3-2*k);
  return cur.map((v,j)=>prev[j]+(v-prev[j])*e);}}return MOOD.n;}
const sceneAt=t=>S.find(sc=>t>=sc.start&&t<sc.start+sc.dur);
const AL='אבגדהוזחטיכלמנסעפצקרשת';
function drawBG(t){
  const [r,g,b]=moodAt(t).map(Math.round);
  cx.fillStyle='#07070a';cx.fillRect(0,0,W,H);
  const gx=W/2+Math.sin(t*.4)*W*.2,gy=H/2+Math.cos(t*.33)*H*.15;
  let gr=cx.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*.8);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.2)`);gr.addColorStop(.5,`rgba(${r},${g},${b},0.05)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  // rotating rings of letters: the generations
  cx.save();cx.translate(W/2,H/2);
  for(let ring=0;ring<3;ring++){
    const R=Math.min(W,H)*(.36+ring*.14),n=28+ring*12;
    cx.save();cx.rotate(t*(.05+ring*.02)*(ring%2?-1:1));
    cx.font=`700 ${Math.round(Math.min(W,H)*.032)}px "Frank Ruhl Libre"`;cx.fillStyle=`rgba(${r},${g},${b},${.05-ring*.012})`;
    for(let i=0;i<n;i++){cx.save();cx.rotate(i/n*Math.PI*2);cx.fillText(AL[(i+ring*5)%22],0,-R);cx.restore();}
    cx.restore();
  }
  cx.restore();
  // the flood: water rising during the 'w' scene
  const sc=sceneAt(t);
  if(sc&&sc.mood==='w'){
    const lt=t-sc.start,lev=Math.min(1,lt/(sc.dur*.85));const top=H*(1-lev*.78);
    cx.fillStyle='rgba(30,80,150,.32)';cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20)cx.lineTo(x,top+Math.sin(x*.008+lt*3)*H*.012+Math.sin(x*.02-lt*2)*H*.006);
    cx.lineTo(W,H);cx.fill();
    cx.fillStyle='rgba(60,120,200,.25)';cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20)cx.lineTo(x,top+H*.03+Math.sin(x*.011-lt*2.4)*H*.014);
    cx.lineTo(W,H);cx.fill();
    // rain
    cx.strokeStyle='rgba(158,197,244,.25)';cx.lineWidth=1.5;
    for(const p of P){const y=((p.y*H+lt*H*1.6*(.5+p.w))%H);const x=p.x*W;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-6,y+H*.03);cx.stroke();}
  }
  for(const p of P){const y=((p.y*H-t*p.v*H)%H+H)%H;const x=p.x*W+Math.sin(t*.8+p.ph)*20;
    const a=.2+.4*Math.sin(t*2.2+p.ph*3)**2;cx.fillStyle=`rgba(${r},${g},${b},${a*(.4+p.w*.6)})`;cx.beginPath();cx.arc(x,y,p.r,0,7);cx.fill();}
  gr=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.85)');
  cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  // letterbox bars for the cinema feel
  if(!V){cx.fillStyle='#000';cx.fillRect(0,0,W,H*.06);cx.fillRect(0,H*.94,W,H*.06);}
}
const U=Math.min(W,H)/100;
const FL='<div class="flash" id="fl"></div>';
const slam=(a,sel,at)=>a(sel,at,.45,{o:0,s:2.4,b:25},{o:1,s:1,b:0},{ease:'expo'});
const flash=(a,at=0)=>a('#fl',at,.4,{o:.6},{o:0},{ease:'out'});
const drift=(a,d)=>a('@',0,d,{s:1},{s:1.06},{ease:'lin'});
const fmt=n=>n.toLocaleString('en-US');
// counters: elements with data-to count up while the scene plays
const counters=[];
function counter(sel,sceneIdx,from,to,at,d){counters.push({sel,sceneIdx,from,to,at,d});}

// series for sparklines
function series(spell,groupPrefix){const d=ND.names[spell];const out=new Array(76).fill(0);
  for(const [k,arr] of Object.entries(d.series))if(!groupPrefix||k.startsWith(groupPrefix))arr.forEach((v,i)=>out[i]+=v);return out;}
function spark(arr,color,id){const max=Math.max(...arr),w=80*U,h=26*U;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-v/max*h).toFixed(1)}`).join(' ');
  return `<svg class="sp" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${h}" y2="${h}" stroke="rgba(255,255,255,.2)"/>
  <polyline id="${id}" points="${pts}" fill="none" stroke="${color}" stroke-width="${U*.6}" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="0" y="${h+U*3.6}" fill="#9a94a6" font-family="Oswald" font-size="${U*2.6}">1949</text><text x="${w}" y="${h+U*3.6}" text-anchor="end" fill="#9a94a6" font-family="Oswald" font-size="${U*2.6}">2024</text></svg>`;}
const wipeSpark=(a,sel,at,d)=>a(sel,at,d,{cl:0},{cl:1},{ease:'io'});

// 1 cold open
scene(3.2,'n',`<div class="col"><div class="k" id="a">In the beginning</div><div class="disp paper" id="b" style="font-size:${U*9}px">there was one name</div></div>`,
  a=>{a.in('#a',.2,{d:1});a.in('#b',1.2,{d:1.1,b:20});drift(a,3.2);});
// 2 adam
scene(2.8,'g',`${FL}<div class="col"><div class="he gold glow" id="a" style="font-size:${U*30}px">אָדָם</div><div class="disp paper" id="b" style="font-size:${U*6}px;letter-spacing:.4em">ADAM</div></div>`,
  a=>{flash(a);slam(a,'#a',0);a.in('#b',.6);drift(a,2.8);});
// 3 ten generations
const G1=[['אָדָם',930],['שֵׁת',912],['אֱנוֹשׁ',905],['קֵינָן',910],['מַהֲלַלְאֵל',895],['יֶרֶד',962],['חֲנוֹךְ',365],['מְתוּשֶׁלַח',969],['לֶמֶךְ',777],['נֹחַ',950]];
scene(6.4,'g',`${FL}<div class="col"><div class="disp paper" id="t" style="font-size:${U*7.5}px">Ten generations</div>
<div class="g10">${G1.map(([h,y],i)=>`<div class="c" id="g${i}"><span class="he">${h}</span><span class="disp">${y}</span></div>`).join('')}</div></div>`,
  a=>{flash(a);slam(a,'#t',0);G1.forEach((_,i)=>a(`#g${i}`,.5+i*.42,.4,{o:0,x:(i%2?1:-1)*80*U/2},{o:1,x:0},{ease:'expo'}));drift(a,6.4);});
// 4 methuselah
scene(3.6,'g',`${FL}<div class="col"><div class="disp gold glow" id="a" style="font-size:${U*22}px">969</div><div class="disp paper" id="b" style="font-size:${U*5}px">years. Methuselah.</div>
<div class="en mute" id="c" style="font-size:${U*3.4}px;font-weight:500">By the Bible’s own dates, he dies in the year of the Flood.</div></div>`,
  a=>{flash(a);slam(a,'#a',0);a.in('#b',.5);a.in('#c',1.2);drift(a,3.6);});
// 5 flood
scene(3.6,'w',`<div class="col"><div class="k sky" id="k">Year 1656</div><div class="disp paper glows" id="a" style="font-size:${U*13}px">Then the waters</div><div class="he sky" id="b" style="font-size:${U*9}px">הַמַּבּוּל</div></div>`,
  a=>{a.in('#k',.1);a.in('#a',.4,{d:1.2,b:20});a.in('#b',1.3);drift(a,3.6);});
// 6 seventy nations
const NAT=['גֹּמֶר','מָגוֹג','יָוָן','תֻבָל','מֶשֶׁךְ','אַשְׁכְּנַז','תַרְשִׁישׁ','כִּתִּים','כּוּשׁ','מִצְרַיִם','פוּט','כְּנַעַן','נִמְרֹד','שְׁבָא','דְּדָן','צִידֹן','חֵת','עֵילָם','אַשּׁוּר','אֲרָם','עוּץ','עֵבֶר','פֶּלֶג','יָקְטָן','אוֹפִיר','חֲוִילָה','דִּקְלָה','יוֹבָב','שֶׁלֶף','חֲצַרְמָוֶת','אַרְפַּכְשַׁד','לוּד','מָדַי','תִירָס','רִיפַת','תֹגַרְמָה'];
seed=99;const NPOS=NAT.map(()=>({x:8+rnd()*84,y:10+rnd()*80,s:2.6+rnd()*3.4,r:(rnd()-.5)*16}));
scene(5.4,'o',`${FL}<div class="cloud">${NAT.map((h,i)=>`<div class="he" id="c${i}" style="left:${NPOS[i].x}%;top:${NPOS[i].y}%;font-size:${U*NPOS[i].s}px;opacity:.85">${h}</div>`).join('')}</div>
<div class="col"><div class="disp gold glow" id="t" style="font-size:${U*13}px">Seventy nations</div><div class="en paper" id="s" style="font-size:${U*3.4}px">Shem · Ham · Japheth. Genesis 10.</div></div>`,
  a=>{flash(a);NAT.forEach((_,i)=>a(`#c${i}`,.05+i*.07,.5,{o:0,s:3,b:12},{o:.55,s:1,b:0},{ease:'expo'}));slam(a,'#t',1.6);a.in('#s',2.2);drift(a,5.4);});
// 7 ten more generations: shrinking lives
const G2=[['שֵׁם',600],['אַרְפַּכְשַׁד',438],['שֶׁלַח',433],['עֵבֶר',464],['פֶּלֶג',239],['רְעוּ',239],['שְׂרוּג',230],['נָחוֹר',148],['תֶּרַח',205]];
scene(5.6,'s',`${FL}<div class="col"><div class="disp paper" id="t" style="font-size:${U*7}px">Ten more generations. Shorter lives.</div>
<div class="gen">${G2.map(([h,y],i)=>`<div class="r" id="h${i}"><div><div class="lab"><span class="disp">${y}</span><span class="he">${h}</span></div><div class="bar" id="bb${i}" style="width:${y/969*100}%;background:var(--sky)"></div></div></div>`).join('')}</div>
<div class="he gold glow" id="ab" style="font-size:${U*12}px">אַבְרָם</div></div>`,
  a=>{flash(a);slam(a,'#t',0);G2.forEach((_,i)=>{a(`#h${i}`,.4+i*.3,.35,{o:0},{o:1});a(`#bb${i}`,.4+i*.3,.6,{sx:0},{sx:1},{ease:'expo'});});slam(a,'#ab',3.6);drift(a,5.6);});
// 8 the turn
scene(3.4,'n',`${FL}<div class="col"><div class="k" id="a">Four thousand years later</div><div class="disp paper" id="b" style="font-size:${U*11}px">the names came back</div></div>`,
  a=>{flash(a);a.in('#a',.1,{d:.8});slam(a,'#b',.9);drift(a,3.4);});
// 9 total
scene(3.4,'g',`${FL}<div class="col"><div class="disp gold glow" id="a" style="font-size:${U*20}px"><span id="cnt">0</span></div><div class="disp paper" id="b" style="font-size:${U*5}px">Israeli babies, 1949–2024</div>
<div class="en mute" id="c" style="font-size:${U*3}px;font-weight:500">carry a name from these chapters. Source: Central Bureau of Statistics</div></div>`,
  a=>{flash(a);slam(a,'#a',0);a.in('#b',.5);a.in('#c',1);drift(a,3.4);});
counter('#cnt',8,0,ND.total,0,2.2);
// 10 jubal / yuval
scene(4.6,'o',`${FL}<div class="col"><div class="en mute" id="q" style="font-size:${U*3.4}px;font-style:italic;font-weight:500">“the ancestor of all who play the lyre and the pipe”</div>
<div class="he gold glow" id="a" style="font-size:${U*22}px">יוּבָל</div><div class="disp paper" id="b" style="font-size:${U*6}px">Jubal → Yuval: ${fmt(ND.yuval)}</div>
<div class="en mute" id="c" style="font-size:${U*3.2}px">#2 name for Jewish girls in 1998</div></div>`,
  a=>{flash(a);a.in('#q',.1);slam(a,'#a',.6);a.in('#b',1.3);a.in('#c',2);drift(a,4.6);});
// 11 adam 2024
const AD=ND.adam2024;const adMax=Math.max(...AD.map(x=>x[1]));
scene(4.8,'g',`${FL}<div class="col"><div class="disp paper" id="t" style="font-size:${U*7}px">Adam, 2024</div>
<div class="bars3">${AD.map(([l,v,c],i)=>`<div class="b" id="b${i}"><div class="v">${fmt(v)}</div><div class="fill" id="f${i}" style="height:${v/adMax*24*U}px;background:${c}"></div><div class="l">${l}</div></div>`).join('')}</div>
<div class="disp gold glow" id="s" style="font-size:${U*5.6}px">One name. Three communities.</div></div>`,
  a=>{flash(a);slam(a,'#t',0);AD.forEach((_,i)=>a(`#b${i}`,.5+i*.3,.7,{o:0,y:30*U},{o:1,y:0},{ease:'expo'}));slam(a,'#s',2.2);drift(a,4.8);});
// 12 nimrod rise and fall
scene(4,'o',`${FL}<div class="col"><div class="he gold glow" id="a" style="font-size:${U*13}px">נִמְרֹד</div><div class="disp paper" id="b" style="font-size:${U*5}px">Nimrod rose. Then fell.</div>
<div id="sp">${spark(series('נמרוד'),'#d95926','pl')}</div><div class="en mute" id="c" style="font-size:${U*3}px">${ND.nimrod}</div></div>`,
  a=>{flash(a);slam(a,'#a',0);a.in('#b',.4);wipeSpark(a,'#sp',.8,1.8);a.in('#c',2.2);drift(a,4);});
// 13 yiska
scene(4,'g',`${FL}<div class="col"><div class="he gold glow" id="a" style="font-size:${U*13}px">יִסְכָּה</div><div class="disp paper" id="b" style="font-size:${U*5}px">Mentioned once in the Torah.</div>
<div id="sp">${spark(series('יסכה'),'#f4c46a','pl2')}</div><div class="en mute" id="c" style="font-size:${U*3}px">${ND.yiska}</div></div>`,
  a=>{flash(a);slam(a,'#a',0);a.in('#b',.4);wipeSpark(a,'#sp',.8,1.8);a.in('#c',2.2);drift(a,4);});
// 14 methuselah again
scene(3.2,'n',`${FL}<div class="col"><div class="he paper" id="a" style="font-size:${U*12}px">מְתוּשֶׁלַח</div><div class="disp gold glow" id="b" style="font-size:${U*7}px">969 years. ${ND.methuselah} Israeli babies.</div></div>`,
  a=>{flash(a);slam(a,'#a',0);slam(a,'#b',.8);drift(a,3.2);});
// 15 title
scene(6.2,'g',`${FL}<div class="col"><div class="he gold glow" id="h" style="font-size:${U*8}px">זֶה סֵפֶר תּוֹלְדֹת אָדָם</div>
<div class="disp paper" id="t" style="font-size:${U*(V?11:12)}px">The Book of Generations</div>
<div class="en mute" id="s" style="font-size:${U*3.2}px;font-weight:500">Every name in Bereshit and Noach. Every baby in Israel.</div>
<div class="disp gold" id="u" style="font-size:${U*3.6}px;letter-spacing:.08em;margin-top:${U*2}px">theothermatthewmiller.com/genealogies</div></div>`,
  a=>{flash(a);a.in('#h',.1,{d:1.4,b:20});slam(a,'#t',.9);a.in('#s',1.8);a.in('#u',2.6);a.out('@',5.4,{d:.8,y:0});});
window.TOTAL=T;
window.SCENES=S.map(s=>({start:s.start,dur:s.dur,mood:s.mood}));
const _render=renderAt;
window.renderAt=function(t){
  _render(t);
  for(const c of counters){const sc=S[c.sceneIdx];const lt=t-sc.start-c.at;const k=Math.max(0,Math.min(1,lt/c.d));const e=1-Math.pow(1-k,3);
    const n=sc.el.querySelector(c.sel);if(n)n.textContent=fmt(Math.round(c.from+(c.to-c.from)*e));}
};
