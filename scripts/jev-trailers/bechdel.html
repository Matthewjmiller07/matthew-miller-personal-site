<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Frank+Ruhl+Libre:wght@400;700;900&family=Inter:wght@400;600;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="trailer.css">
<style>.rule{font-family:'Bebas Neue';font-size:96px;line-height:1.05;letter-spacing:.03em;color:var(--paper)}.rule b{color:var(--gold);font-weight:400}</style>
</head><body>
<canvas id="bg" width="1080" height="1920"></canvas><canvas id="viz" width="1080" height="1920"></canvas><div id="stage"></div>
<script>const stage=document.getElementById('stage');</script>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
// The Bechdel test, asked of every chapter of Tanakh.
const D = window.DATA;
const cells = [];   // every chapter in order: {book, ch, lvl, strict}
D.bechdel.forEach((r) => [...r.levels].forEach((l, i) => cells.push({ book: r.book, ch: i + 1, lvl: +l, strict: r.strict[i] === '1' })));
const n1 = cells.filter((c) => c.lvl >= 1).length, n2 = cells.filter((c) => c.lvl >= 2).length;
const passing = cells.filter((c) => c.lvl === 3), strictPass = cells.filter((c) => c.strict);
const COLS = 29, CELL = 30, GAP = 4, GX = (1080 - COLS * (CELL + GAP)) / 2, GY = 470;
const pos = (i) => [GX + (i % COLS) * (CELL + GAP), GY + Math.floor(i / COLS) * (CELL + GAP)];

// 0 · cold open
scene(3.4,'g',`${FL}<div class="c disp gold glowg" id="a" style="top:640px;font-size:260px">1985.</div>
<div class="c en" id="b" style="top:930px;font-size:52px;font-weight:600;padding:0 100px">A comic strip asks three questions of a movie.</div>`,a=>{flash(a);slam(a,'#a',.1);a.in('#b',1);drift(a,3.4);});

// 1 · the rules
scene(6.2,'t',`<div class="c en mute" id="k" style="top:380px;font-size:36px;font-weight:800;letter-spacing:.3em">THE BECHDEL TEST</div>
<div class="c rule" id="r1" style="top:560px"><b>1.</b> TWO NAMED WOMEN</div>
<div class="c rule" id="r2" style="top:760px"><b>2.</b> WHO TALK<br>TO EACH OTHER</div>
<div class="c rule" id="r3" style="top:1060px"><b>3.</b> ABOUT SOMETHING<br>OTHER THAN A MAN</div>`,a=>{a.in('#k',0);slam(a,'#r1',.5);slam(a,'#r2',1.8);slam(a,'#r3',3.1);drift(a,6.2);});

// 2 · the turn
scene(3.4,'r',`${FL}<div class="c disp paper" id="a" style="top:560px;font-size:120px">WE ASKED</div>
<div class="c he gold glowg" id="b" style="top:690px;font-size:300px;font-weight:900">תנ״ך</div>
<div class="c en mute" id="c" style="top:1130px;font-size:44px;font-weight:600">Every chapter. All three questions.</div>`,a=>{flash(a);slam(a,'#a',.05);slam(a,'#b',.45);a.in('#c',1.3);drift(a,3.4);});

// 3–5 · the grid, step by step (no chapter has two women talking and then fails step 3, so 2 and 3 share a beat)
const grid = (title, sub, mood, dur, size = 104) => scene(dur, mood, `<div class="c disp ${mood==='g'?'gold glowg':mood==='r'?'red glowr':'teal glowt'}" id="h" style="top:200px;font-size:${size}px">${title}</div>
<div class="c en" id="s" style="top:1600px;font-size:46px;font-weight:600;padding:0 80px">${sub}</div>`,a=>{slam(a,'#h',0);a.in('#s',.7);});
grid(`${cells.length} CHAPTERS`, 'Genesis 1 to 2 Chronicles 36.', 'n', 4.2, 120);
grid(`${n1} HAVE TWO NAMED WOMEN`, 'Step one. Most of Tanakh is gone already.', 't', 4.4, 92);
grid(`ONLY ${n2} LET THEM TALK`, `…and all ${passing.length} are about more than a man.<br><span class="gold">${passing.map((c) => `${c.book} ${c.ch}`).join(' · ')}</span>`, 'g', 5.6, 112);
const G0 = 3;   // index of the first grid scene
VIZ.push((g, t, sc) => {
  if (sc < G0 || sc > G0 + 2) return;
  const step = sc - G0, lt = t - S[sc].start;
  cells.forEach((c, i) => {
    const [x, y] = pos(i);
    if (step === 0) {   // the whole of Tanakh fills in
      g.globalAlpha = Math.min(1, Math.max(0, (lt * 320 - i) / 40));
      g.fillStyle = 'rgba(239,230,210,.55)'; g.fillRect(x, y, CELL, CELL); return;
    }
    const need = step === 1 ? 1 : 2;
    const on = c.lvl >= need, was = step === 1 || c.lvl >= 1;
    // cells that fail this step fade out over the first second
    const a = on ? 1 : was ? Math.max(0.06, 1 - lt / 0.9) : 0.06;
    g.globalAlpha = a;
    g.fillStyle = on ? (step === 1 ? '#5fd8e6' : '#f4c46a') : 'rgba(239,230,210,.4)';
    g.fillRect(x, y, CELL, CELL);
    if (step === 2 && on) { g.globalAlpha = .55 + .45 * Math.sin(lt * 4); g.shadowColor = '#f4c46a'; g.shadowBlur = 40; g.fillRect(x - 3, y - 3, CELL + 6, CELL + 6); g.shadowBlur = 0; }
  });
  g.globalAlpha = 1;
});

// 7 · Ruth and Naomi
scene(5.4,'g',`${FL}<div class="c en mute" id="k" style="top:420px;font-size:36px;font-weight:800;letter-spacing:.3em">RUTH 1:16</div>
<div class="c he gold glowg" id="h" style="top:530px;font-size:104px;font-weight:900;line-height:1.35;padding:0 60px">כִּי אֶל־אֲשֶׁר תֵּלְכִי אֵלֵךְ</div>
<div class="c disp paper" id="e" style="top:860px;font-size:104px">“WHITHER THOU GOEST,<br>I WILL GO.”</div>
<div class="c en mute" id="c" style="top:1180px;font-size:44px;font-weight:600">Ruth, to Naomi. The Bible's clearest pass.</div>`,a=>{flash(a);a.in('#k',.1);a.wipe('#h',.4,{d:1.1});slam(a,'#e',1.6);a.in('#c',2.6);drift(a,5.4);});

// 8 · the near misses
scene(5.6,'r',`<div class="c disp red glowr" id="h" style="top:300px;font-size:120px">SO CLOSE</div>
<div class="c en" id="m1" style="top:560px;font-size:52px;font-weight:600"><span class="gold">Deborah & Yael</span> never meet.</div>
<div class="c en" id="m2" style="top:700px;font-size:52px;font-weight:600"><span class="gold">Sarai & Hagar</span> never speak to each other.</div>
<div class="c en" id="m3" style="top:840px;font-size:52px;font-weight:600"><span class="gold">Miriam</span> isn't named in Exodus 2.</div>
<div class="c disp paper" id="m4" style="top:1060px;font-size:96px">MEGILLAT ESTHER: 0 FOR 10.</div>
<div class="c en mute" id="m5" style="top:1260px;font-size:44px;font-weight:600">Strict version? Only ${strictPass.map((c)=>`${c.book} ${c.ch}`).join(', ')} survives.</div>`,a=>{
  slam(a,'#h',0);a.in('#m1',.6);a.in('#m2',1.2);a.in('#m3',1.8);slam(a,'#m4',2.6);a.in('#m5',3.6);});

// 9 · end card
scene(6,'g',`${FL}<div class="c en mute" id="k" style="top:440px;font-size:36px;font-weight:800;letter-spacing:.3em">MEGA BIBLE</div>
<div class="c disp gold glowg" id="t" style="top:520px;font-size:230px">THE BECHDEL</div>
<div class="c disp paper" id="t2" style="top:740px;font-size:230px">TEST</div>
<div class="c en" id="j" style="top:1010px;font-size:42px;font-weight:600;padding:0 100px">${cells.length} chapters, judged by Jev,<br>a small AI model from TypeSafe.</div>
<div class="c" id="w" style="top:1260px"><span class="tag g">Every chapter · live now</span><div class="en" style="font-size:44px;font-weight:700;margin-top:30px">theothermatthewmiller.com<br><span class="gold">/mega-bible</span></div></div>`,a=>{
  a('#fl',0,.6,{o:1},{o:0});a.in('#k',.2);a('#t',.3,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});a('#t2',.6,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});
  a.in('#j',1.4);a.in('#w',2.3);drift(a,6);});

finish();
</script></body></html>
