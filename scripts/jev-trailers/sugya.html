<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Frank+Ruhl+Libre:wght@400;700;900&family=Inter:wght@400;600;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="trailer.css">
</head><body>
<canvas id="bg" width="1080" height="1920"></canvas><canvas id="viz" width="1080" height="1920"></canvas><div id="stage"></div>
<script>const stage=document.getElementById('stage');</script>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
// The Sugya Map: one daf → its sugyot → a masechet → Shas.
const D = window.DATA, PAL = D.palette;
const LABEL = Object.fromEntries(D.moves.map((m) => [m.code, m.label]));
const ber2 = D.shas.find((t) => t.title === 'Berakhot').dafim[2] || '';
const bek = D.shas.find((t) => t.title === 'Bekhorot');
const fmt = (n) => n.toLocaleString('en-US');

// 0 · cold open
scene(3.2,'g',`${FL}<div class="c disp gold glowg" id="a" style="top:640px;font-size:180px">THE WHOLE<br>TALMUD.</div>
<div class="c en" id="b" style="top:1030px;font-size:56px;font-weight:600">Every daf of it an argument.</div>`,a=>{flash(a);slam(a,'#a',.1);a.in('#b',.9);drift(a,3.2);});

// 1 · the wall of text
scene(4,'n',`<div class="c he paper" id="t" style="top:260px;font-size:48px;line-height:1.75;padding:0 80px;opacity:.85">${D.berakhotHe.slice(0,4).join(' ')}</div>
<div class="c disp gold glowg" id="q" style="top:1520px;font-size:110px">WHAT SHAPE IS IT?</div>`,a=>{
  a('#t',0,4,{o:0,y:80,b:6},{o:.55,y:-40,b:0},{ease:'out'});slam(a,'#q',1.6);});

// 2 · Jev reads every segment (bars drop in, labelled)
scene(6,'t',`<div class="c en mute" id="k" style="top:200px;font-size:34px;font-weight:800;letter-spacing:.3em">BERAKHOT 2</div>
<div class="c disp teal glowt" id="h" style="top:250px;font-size:104px">JEV READS EVERY SEGMENT</div>
<div class="c" id="lg" style="top:1580px;padding:0 70px">${D.moves.map((m)=>`<span class="chip" style="--c:${PAL[m.code]}">${m.label}</span>`).join('')}</div>`,a=>{
  a.in('#k',0);slam(a,'#h',.15);a.in('#lg .chip',2.2,{d:.4,stagger:.12,y:20});});
VIZ.push((g,t,sc)=>{   // bars
  if(sc!==2)return;const lt=t-S[2].start;const segs=ber2.slice(0,22);const top=470,h=44,gap=6;
  [...segs].forEach((c,i)=>{const at=.5+i*.18;if(lt<at)return;const k=Math.min(1,(lt-at)/.35),e=1-Math.pow(1-k,3);
    const y=top+i*(h+gap);g.globalAlpha=e;g.fillStyle=PAL[c.toLowerCase()];
    g.fillRect(140+(1-e)*300,y,800*e,h);
    g.fillStyle='#08070c';g.font='800 24px Inter';g.textBaseline='middle';
    if(e>.9)g.fillText(LABEL[c.toLowerCase()].toUpperCase(),160,y+h/2+1);g.globalAlpha=1;});
});

// 3 · the daf splits into sugyot
scene(5.4,'g',`<div class="c disp gold glowg" id="h" style="top:200px;font-size:110px">THE SUGYOT APPEAR</div>
<div class="c en" id="s1" style="top:1500px;font-size:40px;font-weight:600"><span class="gold">SUGYA 1</span> · Mishnah → Dispute → Story</div>
<div class="c en" id="s2" style="top:1570px;font-size:40px;font-weight:600"><span class="teal">SUGYA 2</span> · Question → Answer → Question…</div>`,a=>{
  slam(a,'#h',0);a.in('#s1',1.8);a.in('#s2',2.4);});
VIZ.push((g,t,sc)=>{   // one tall column that opens at sugya breaks
  if(sc!==3)return;const lt=t-S[3].start;const open=Math.min(1,Math.max(0,(lt-.8)/1.2));const eo=open*open*(3-2*open);
  const n=ber2.length;const breaks=[...ber2].filter((c,i)=>i&&c!==c.toLowerCase()).length;
  const H=1000-breaks*40*eo,sh=H/n;let y=400;
  [...ber2].forEach((c,i)=>{if(i&&c!==c.toLowerCase())y+=40*eo;g.fillStyle=PAL[c.toLowerCase()];g.fillRect(390,y,300,sh+.5);y+=sh;});
});

// 4 · a whole masechet weaves itself
scene(6.4,'t',`<div class="c he paper" id="he" style="top:150px;font-size:110px;font-weight:900">מסכת בכורות</div>
<div class="c en mute" id="k" style="top:310px;font-size:34px;font-weight:800;letter-spacing:.3em">ONE COLUMN PER DAF</div>
<div class="c disp teal glowt" id="n" style="top:1560px;font-size:88px">${Object.keys(bek.dafim).length} DAFIM · ${fmt(Object.values(bek.dafim).join('').length)} SEGMENTS</div>`,a=>{
  a('#he',0,.8,{o:0,s:1.4,b:20},{o:1,s:1,b:0},{ease:'expo'});a.in('#k',.4);slam(a,'#n',3.6);});
VIZ.push((g,t,sc)=>{
  if(sc!==4)return;const lt=t-S[4].start;const ds=Object.keys(bek.dafim).map(Number).sort((a,b)=>a-b);
  const x0=60,w=960,step=w/ds.length,top=420,H=1060;
  ds.forEach((d,i)=>{const at=.3+i*.045;if(lt<at)return;const k=Math.min(1,(lt-at)/.5);const s=bek.dafim[d],sh=H/s.length;
    for(let j=0;j<s.length;j++){if(j/s.length>k)break;const c=s[j];g.fillStyle=PAL[c.toLowerCase()];g.fillRect(x0+i*step+1,top+j*sh,step-2,sh+.5);
      if(j&&c!==c.toLowerCase()){g.fillStyle='#08070c';g.fillRect(x0+i*step+1,top+j*sh-2,step-2,3);}}});
});

// 5 · all of Shas
const SEDER_NAMES={'Seder Zeraim':'ZERAIM','Seder Moed':'MOED','Seder Nashim':'NASHIM','Seder Nezikin':'NEZIKIN','Seder Kodashim':'KODASHIM','Seder Tahorot':'TAHOROT'};
scene(6.6,'g',`<div class="c disp gold glowg" id="h" style="top:150px;font-size:150px">ALL OF SHAS</div>
<div class="c disp paper" id="n" style="top:1640px;font-size:84px">${fmt(D.stats.segs)} SEGMENTS · ${fmt(D.stats.sugyot)} SUGYOT</div>`,a=>{
  slam(a,'#h',0);slam(a,'#n',4.2);});
VIZ.push((g,t,sc)=>{
  if(sc!==5)return;const lt=t-S[5].start;const rows=D.shas;const top=360,H=1220,rh=H/rows.length;const x0=60,w=960;
  rows.forEach((tr,ri)=>{const at=.3+ri*.08;if(lt<at)return;const k=Math.min(1,(lt-at)/.8);
    const ks=Object.keys(tr.dafim).map(Number),first=ks.length?Math.min(...ks):2;   // Tamid's Gemara begins at 25b
    const n=tr.lastDaf-first+1,step=w/n;
    for(let d=first;d<=tr.lastDaf;d++){if((d-first)/n>k)break;const s=tr.dafim[d];const x=x0+(d-first)*step;
      if(!s){g.fillStyle='rgba(239,230,210,.07)';g.fillRect(x,top+ri*rh+1,Math.max(.6,step-.4),rh-3);continue;}
      const sh=(rh-3)/s.length;for(let j=0;j<s.length;j++){g.fillStyle=PAL[s[j].toLowerCase()];g.fillRect(x,top+ri*rh+1+j*sh,Math.max(.6,step-.3),sh+.3);}}});
});

// 6 · the punchline
scene(3.8,'r',`${FL}<div class="c disp red glowr" id="a" style="top:640px;font-size:150px">${fmt(Math.round(D.stats.segs/1000))},000 JUDGMENTS</div>
<div class="c disp paper" id="b" style="top:830px;font-size:116px">BY ONE SMALL MODEL</div>
<div class="c en mute" id="c" style="top:1010px;font-size:44px;font-weight:600">TypeSafe's Jev. For less than five dollars.</div>`,a=>{flash(a);slam(a,'#a',.1);slam(a,'#b',.6);a.in('#c',1.4);drift(a,3.8);});

// 7 · end card
scene(6,'g',`${FL}<div class="c en mute" id="k" style="top:420px;font-size:36px;font-weight:800;letter-spacing:.3em">MEGA TALMUD</div>
<div class="c disp gold glowg" id="t" style="top:500px;font-size:230px">THE SUGYA</div>
<div class="c disp paper" id="t2" style="top:720px;font-size:230px">MAP</div>
<div class="c" id="lg" style="top:1010px;padding:0 70px">${D.moves.map((m)=>`<span class="chip" style="--c:${PAL[m.code]}">${m.label}</span>`).join('')}</div>
<div class="c" id="w" style="top:1330px"><span class="tag g">Every daf · live now</span><div class="en" style="font-size:44px;font-weight:700;margin-top:30px">theothermatthewmiller.com<br><span class="gold">/mega-talmud</span></div></div>`,a=>{
  a('#fl',0,.6,{o:1},{o:0});a.in('#k',.2);a('#t',.3,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});a('#t2',.6,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});
  a.in('#lg .chip',1.3,{d:.35,stagger:.07,y:16});a.in('#w',2.4);drift(a,6);});

finish();
</script></body></html>
