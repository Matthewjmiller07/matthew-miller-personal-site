<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
:root{--gold:#f4c46a;--teal:#5fd8e6;--red:#ff4d5e;--ink:#08070c;--paper:#efe6d2;--mute:#9a94a6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
#bg{position:absolute;inset:0}#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.c{position:absolute;left:0;right:0;text-align:center}
.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;unicode-bidi:isolate}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;line-height:.95}
.en{font-family:'Inter',sans-serif;color:var(--paper)}
.gold{color:var(--gold)}.teal{color:var(--teal)}.red{color:var(--red)}.mute{color:var(--mute)}.paper{color:var(--paper)}
.glowg{text-shadow:0 0 50px rgba(244,196,106,.6),0 0 4px rgba(255,223,158,.6)}
.glowt{text-shadow:0 0 50px rgba(95,216,230,.55),0 0 4px rgba(181,243,250,.6)}
.glowr{text-shadow:0 0 60px rgba(255,77,94,.6)}
.hl{--g:0;white-space:nowrap;border-radius:12px;padding:0 .12em;background:rgba(244,196,106,calc(var(--g)*.28));box-shadow:0 0 calc(var(--g)*40px) rgba(244,196,106,calc(var(--g)*.5)),inset 0 0 0 calc(var(--g)*4px) rgba(255,223,158,calc(var(--g)*.9))}
.hlt{--g:0;white-space:nowrap;border-radius:12px;padding:0 .12em;background:rgba(95,216,230,calc(var(--g)*.25));box-shadow:0 0 calc(var(--g)*40px) rgba(95,216,230,calc(var(--g)*.5)),inset 0 0 0 calc(var(--g)*4px) rgba(181,243,250,calc(var(--g)*.9))}
.tag{display:inline-block;font-family:'Inter';font-weight:800;font-size:30px;letter-spacing:.22em;text-transform:uppercase;padding:12px 28px;border-radius:999px}
.tag.g{color:#1a1206;background:var(--gold)}.tag.t{color:#04181b;background:var(--teal)}.tag.r{color:#fff;background:var(--red)}
.flash{position:absolute;inset:0;background:#fff}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas><div id="stage"></div>
<script>const stage=document.getElementById('stage');</script>
<script src="engine.js"></script>
<script>
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=Array.from({length:160},()=>({x:rnd()*1080,y:rnd()*1920,v:20+rnd()*70,r:.8+rnd()*2.8,ph:rnd()*6.28,w:rnd()}));
const MOOD={g:[244,196,106],t:[95,216,230],n:[180,160,200],r:[255,77,94]};
function moodAt(t){for(let i=0;i<S.length;i++){const sc=S[i];if(t>=sc.start&&t<sc.start+sc.dur){
  const cur=MOOD[sc.mood],prev=i?MOOD[S[i-1].mood]:cur;const k=Math.min(1,(t-sc.start)/.6);const e=k*k*(3-2*k);
  return cur.map((v,j)=>prev[j]+(v-prev[j])*e);}}return MOOD.n;}
function drawBG(t){
  const [r,g,b]=moodAt(t).map(Math.round);
  cx.fillStyle='#08070c';cx.fillRect(0,0,1080,1920);
  const gx=540+Math.sin(t*.5)*200,gy=960+Math.cos(t*.4)*300;
  let gr=cx.createRadialGradient(gx,gy,0,gx,gy,1300);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.2)`);gr.addColorStop(.5,`rgba(${r},${g},${b},0.05)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,1080,1920);
  cx.save();cx.translate(540,960);cx.rotate(t*.08);cx.font='700 52px "Frank Ruhl Libre"';
  cx.fillStyle=`rgba(${r},${g},${b},0.06)`;const AL='אבגדהוזחטיכלמנסעפצקרשת';
  for(let i=0;i<40;i++){cx.save();cx.rotate(i/40*Math.PI*2);cx.fillText(AL[i%22],0,-480);cx.restore();}
  cx.restore();
  for(const p of P){const y=((p.y-t*p.v)%2020+2020)%2020-50;const x=p.x+Math.sin(t*.9+p.ph)*30;
    const a=.25+.4*Math.sin(t*2.5+p.ph*3)**2;cx.fillStyle=`rgba(${r},${g},${b},${a*(.4+p.w*.6)})`;cx.beginPath();cx.arc(x,y,p.r,0,7);cx.fill();}
  gr=cx.createRadialGradient(540,960,500,540,960,1300);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.8)');
  cx.fillStyle=gr;cx.fillRect(0,0,1080,1920);
}
const slam=(a,sel,at)=>a(sel,at,.45,{o:0,s:2.2,b:25},{o:1,s:1,b:0},{ease:'expo'});
const FL='<div class="flash" id="fl"></div>';
const flash=(a,at=0)=>a('#fl',at,.35,{o:.55},{o:0},{ease:'out'});
const drift=(a,d)=>a('@',0,d,{s:1},{s:1.05},{ease:'lin'});

// 1
scene(2.6,'g',`${FL}<div class="c disp mute" id="k" style="top:760px;font-size:64px;letter-spacing:.3em">SAME BLESSING.</div>
<div class="c he gold glowg" id="a" style="top:900px;font-size:150px;font-weight:900;line-height:1.3">בֵּין הַקֹּדֶשׁ<br>וּבֵין הַחֹל</div>`,a=>{flash(a);a.in('#k',.05,{d:.5});slam(a,'#a',.3);drift(a,2.6);});
// 2
scene(2.6,'t',`${FL}<div class="c disp mute" id="k" style="top:700px;font-size:64px;letter-spacing:.3em">DIFFERENT WORDS.</div>
<div class="c he teal glowt" id="a" style="top:860px;font-size:160px;font-weight:900">בֵּין קֹדֶשׁ לְחֹל</div>
<div class="c disp red glowr" id="w" style="top:1220px;font-size:200px">WHY?</div>`,a=>{flash(a);a.in('#k',.05,{d:.5});slam(a,'#a',.25);slam(a,'#w',1.4);drift(a,2.6);});
// 3 two giants
scene(3,'n',`${FL}<div class="c disp paper" id="t" style="top:420px;font-size:150px">TWO GIANTS.</div>
<div class="c" id="m" style="top:680px"><div class="tag g">Shulchan Aruch · Tzfat</div><div class="he gold glowg" style="font-size:170px;font-weight:900;margin-top:130px">הַמְחַבֵּר</div></div>
<div class="c disp red glowr" id="vs" style="top:1020px;font-size:180px">VS</div>
<div class="c" id="r" style="top:1220px"><div class="tag t">HaMapah · Kraków</div><div class="he teal glowt" style="font-size:170px;font-weight:900;margin-top:130px">הָרְמָ״א</div></div>`,a=>{
  flash(a);slam(a,'#t',0);a('#m',.4,.5,{o:0,x:600},{o:1,x:0},{ease:'expo'});a('#r',.7,.5,{o:0,x:-600},{o:1,x:0},{ease:'expo'});a('#vs',1.1,.4,{o:0,s:4,r:-20},{o:1,s:1,r:0},{ease:'back'});drift(a,3);});
// 4 three blessings
scene(3.6,'g',`${FL}<div class="c disp paper" id="t" style="top:430px;font-size:150px">THREE BLESSINGS.</div>
<div class="c" id="b1" style="top:750px"><div class="he gold glowg" style="font-size:140px;font-weight:900">הַבְדָּלָה</div><div class="disp mute" style="font-size:60px">HAVDALAH</div></div>
<div class="c" id="b2" style="top:1050px"><div class="he gold glowg" style="font-size:140px;font-weight:900">חַלָּה</div><div class="disp mute" style="font-size:60px">CHALLAH</div></div>
<div class="c" id="b3" style="top:1350px"><div class="he gold glowg" style="font-size:140px;font-weight:900">שְׁמִינִי עֲצֶרֶת</div><div class="disp mute" style="font-size:60px">SHEMINI ATZERET</div></div>`,a=>{
  flash(a);slam(a,'#t',0);slam(a,'#b1',.6);slam(a,'#b2',1.2);slam(a,'#b3',1.8);drift(a,3.6);});
// 5 one question
scene(3.6,'n',`${FL}<div class="c disp paper" id="t" style="top:420px;font-size:150px">ONE QUESTION:</div>
<div class="c en" id="q" style="top:700px;font-size:62px;font-weight:800;line-height:1.3;padding:0 80px">Did Chazal write our blessings in…</div>
<div class="c he gold glowg" id="a" style="top:960px;font-size:120px;font-weight:900">לְשׁוֹן הַמִּקְרָא</div><div class="c disp gold" id="a2" style="top:1130px;font-size:56px">THE TORAH'S HEBREW</div>
<div class="c disp red" id="or" style="top:1230px;font-size:90px">OR</div>
<div class="c he teal glowt" id="b" style="top:1340px;font-size:120px;font-weight:900">לְשׁוֹן חֲכָמִים</div><div class="c disp teal" id="b2" style="top:1510px;font-size:56px">THE SAGES' HEBREW?</div>`,a=>{
  flash(a);slam(a,'#t',0);a.in('#q',.4,{d:.5});slam(a,'#a',1);a.in('#a2',1.2,{d:.4});slam(a,'#or',1.6);slam(a,'#b',1.9);a.in('#b2',2.1,{d:.4});drift(a,3.6);});
// 6 Rav Yaakov quote
scene(3.4,'g',`${FL}<div class="c en mute" id="l" style="top:420px;font-size:36px;font-weight:600;letter-spacing:.25em">RAV YAAKOV KAMENETSKY</div>
<div class="c he paper" id="q" style="top:560px;font-size:84px;font-weight:700;line-height:1.5;padding:0 70px">״ונראה שפליגי אי חז״ל תקנו הברכות לפי <span class="hl">לשון התורה</span> או לפי <span class="hlt">לשון חכמים</span>״</div>
<div class="c en" id="e" style="top:1240px;font-size:46px;font-weight:600;line-height:1.35;padding:0 90px">“They argue: whose Hebrew do our blessings speak?”</div>`,a=>{
  flash(a);a.in('#l',0,{d:.4});a.wipe('#q',.2,{d:1.2});a.glow('.hl,.hlt',1.4);a.in('#e',1.6,{d:.5});drift(a,3.4);});
// 7 but wait
scene(2.2,'r',`${FL}<div class="c disp red glowr" id="w" style="top:700px;font-size:300px">BUT<br>WAIT.</div>`,a=>{
  a('#fl',0,.5,{o:.9},{o:0});a('#w',0,.3,{o:0,s:3},{o:1,s:1},{ease:'expo'});a('#w',.4,.06,{x:-20},{x:20},{ease:'lin'});a('#w',.46,.06,{x:20},{x:-12},{ease:'lin'});a('#w',.52,.06,{x:-12},{x:0},{ease:'lin'});});
// 8 lo plegi
scene(3.2,'r',`${FL}<div class="c he paper" id="h" style="top:640px;font-size:110px;font-weight:900;line-height:1.4">דהמחבר והרמ״א<br><span class="hl">לא פליגי</span></div>
<div class="c en" id="e" style="top:1050px;font-size:60px;font-weight:800;line-height:1.3;padding:0 90px">What if they <span class="red">never disagreed at all?</span></div>`,a=>{
  flash(a);a.wipe('#h',0,{d:.9});a.glow('.hl',1);a.in('#e',1.3,{d:.5});drift(a,3.2);});
// 9 tease: Israel vs chutz, simchat torah
scene(3.4,'t',`${FL}<div class="c disp gold glowg" id="a" style="top:420px;font-size:110px">ERETZ YISRAEL</div>
<div class="c disp red" id="v" style="top:560px;font-size:80px">VS.</div>
<div class="c disp teal glowt" id="b" style="top:660px;font-size:110px">CHUTZ LA'ARETZ</div>
<div class="c he paper" id="q" style="top:960px;font-size:92px;font-weight:900">״אתי <span class="hl">לזלזולי</span><br>ביום טוב של שמחת תורה״</div>
<div class="c en" id="e" style="top:1290px;font-size:46px;font-weight:600;line-height:1.35;padding:0 90px">…and the one word that could <span class="red">belittle a Yom Tov.</span></div>`,a=>{
  flash(a);slam(a,'#a',0);slam(a,'#v',.3);slam(a,'#b',.5);a.wipe('#q',1,{d:.9});a.glow('.hl',1.9);a.in('#e',2.1,{d:.5});drift(a,3.4);});
// 10 title card
scene(6.4,'g',`${FL}<div class="c en mute" id="k" style="top:420px;font-size:36px;font-weight:600;letter-spacing:.3em">RAV YAAKOV KAMENETSKY</div>
<div class="c disp gold glowg" id="t" style="top:500px;font-size:210px">THE<br>LANGUAGE</div>
<div class="c disp paper" id="t2" style="top:900px;font-size:210px">OF BLESSING</div>
<div class="c he teal glowt" id="h" style="top:1130px;font-size:72px;font-weight:700">לְשׁוֹן הַמִּקְרָא · לְשׁוֹן חֲכָמִים</div>
<div class="c" id="w" style="top:1300px"><span class="tag r">Full video · 4 min</span><div class="en" style="font-size:40px;font-weight:700;margin-top:28px">theothermatthewmiller.com<br><span class="gold">/language-of-blessing</span></div></div>
<div class="c he gold glowg" id="cs" style="top:1620px;font-size:100px;font-weight:900">חַג שָׂמֵחַ</div>`,a=>{
  a('#fl',0,.6,{o:1},{o:0});a.in('#k',.2);a('#t',.3,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});a('#t2',.6,.8,{o:0,s:1.6,b:30},{o:1,s:1,b:0},{ease:'expo'});
  a.wipe('#h',1.4,{d:.9});a.in('#w',2.3);a('#cs',3.2,.8,{o:0,s:1.8,b:20},{o:1,s:1,b:0},{ease:'expo'});drift(a,6.4);});
window.TOTAL=T;window.SCENES=S.map(s=>({start:s.start,dur:s.dur,mood:s.mood}));window.renderAt=renderAt;
if(!location.search.includes('render')){const t0=performance.now();const loop=()=>{renderAt(((performance.now()-t0)/1000)%T);requestAnimationFrame(loop)};document.fonts.ready.then(loop);}
</script></body></html>
