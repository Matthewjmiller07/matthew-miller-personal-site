<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@500;600&family=Frank+Ruhl+Libre:wght@400;500;700&display=block" rel="stylesheet">
</head><body style="margin:0"><canvas id="c"></canvas>
<script>
// 18×24 in print poster of the sugya map (300 dpi). draw(spec) is called by render.mjs with:
// { kind: 'masechet' | 'rows', title, he, sub, rows: [{ title, he, lastDaf, dafim: { d: [[move, conf, newSugya], …] } }], colors, labels, order }
const PARCH = '#f6efdf', INK = '#231c12', GOLD = '#9a7632';
window.fontsReady = () => Promise.all(['500 100px "Frank Ruhl Libre"', '600 100px "Cormorant SC"', 'italic 400 100px "Cormorant Garamond"', '500 100px "Cormorant Garamond"']
  .map((f) => document.fonts.load(f, 'אבג abc')));
function spaced(g, text, x, y, sp) {
  const ch = [...text]; const w = ch.reduce((a, c) => a + g.measureText(c).width, 0) + sp * (ch.length - 1);
  let cx = x - w / 2; g.textAlign = 'left'; for (const c of ch) { g.fillText(c, cx, y); cx += g.measureText(c).width + sp; } g.textAlign = 'center';
}
function column(g, entry, x, top, w, h, colors) {
  const n = entry.s.length, sh = h / n;
  entry.s.forEach(([mv, conf, ns], k) => {
    g.globalAlpha = conf < 0.45 ? 0.78 : 1; g.fillStyle = colors[mv] || '#ccc';
    g.fillRect(x, top + k * sh, w, sh + 0.5); g.globalAlpha = 1;
    if (k && ns >= 0.5 && sh > 3) { g.fillStyle = PARCH; g.fillRect(x, top + k * sh - Math.min(4, sh * .12), w, Math.min(10, sh * .3)); }
  });
}
const firstDaf = (r) => { const k = Object.keys(r.dafim).map(Number); return k.length ? Math.min(...k) : 2; };
window.draw = (spec) => {
  const W = 5400, H = 7200, u = W / 18;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = PARCH; g.fillRect(0, 0, W, H);
  g.strokeStyle = GOLD; g.lineWidth = u * 0.025; g.strokeRect(u * 0.55, u * 0.55, W - u * 1.1, H - u * 1.1);
  g.lineWidth = u * 0.008; g.strokeRect(u * 0.66, u * 0.66, W - u * 1.32, H - u * 1.32);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = INK;
  const heSize = spec.he.length > 12 ? 0.95 : 1.15;
  g.font = `500 ${u * heSize}px "Frank Ruhl Libre"`; g.direction = 'rtl'; g.fillText(spec.he, W / 2, u * 2.2); g.direction = 'ltr';
  g.font = `600 ${u * 0.3}px "Cormorant SC"`; g.fillStyle = GOLD; spaced(g, spec.title.toUpperCase(), W / 2, u * 2.75, u * 0.12);
  g.fillStyle = INK; g.font = `italic 400 ${u * 0.36}px "Cormorant Garamond"`; g.fillText(spec.sub, W / 2, u * 3.3);

  const m = u * 1.25, top = u * 3.85, bottom = H - u * 2.75;
  let segs = 0, sugyot = 0, dafim = 0;
  const count = (e) => { dafim++; segs += e.s.length; sugyot += 1 + e.s.filter((x, k) => k && x[2] >= 0.5).length; };
  if (spec.kind === 'masechet') {
    const r = spec.rows[0];
    const first = firstDaf(r);   // Tamid's Gemara only begins at 25b
    const ds = Array.from({ length: r.lastDaf - first + 1 }, (_, i) => i + first);
    const step = (W - 2 * m) / ds.length, gap = Math.max(3, step * 0.1), colW = step - gap, every = ds.length > 90 ? 10 : ds.length > 45 ? 5 : 1;
    ds.forEach((d, i) => {
      const x = m + i * step + gap / 2, e = r.dafim[d];
      if (e) { column(g, e, x, top, colW, bottom - top, spec.colors); count(e);
        if (e.a && e.a < e.s.length) { g.fillStyle = GOLD; g.fillRect(x - gap / 2, top + (e.a / e.s.length) * (bottom - top) - u * 0.008, gap, u * 0.016); } }
      else { g.fillStyle = 'rgba(154,118,50,.08)'; g.fillRect(x, top, colW, bottom - top); }
      if (d === first || d % every === 0 || d === r.lastDaf) { g.fillStyle = INK; g.font = `500 ${u * 0.16}px "Cormorant Garamond"`; g.fillText(String(d), x + colW / 2, bottom + u * 0.3); }
    });
  } else {
    // one band per masechet, labels on the left, sedarim separated
    const labelW = u * 2.4, x0 = m + labelW, w = W - m - x0;
    const sederGap = spec.rows.length > 12 ? u * 0.25 : 0;
    const nSed = new Set(spec.rows.map((r) => r.seder)).size;
    const rowGap = u * (spec.rows.length > 12 ? 0.05 : 0.12);
    const rh = (bottom - top - sederGap * (nSed - 1) - rowGap * (spec.rows.length - 1)) / spec.rows.length;
    let y = top;
    spec.rows.forEach((r, ri) => {
      if (ri && r.seder !== spec.rows[ri - 1].seder) y += sederGap;
      const first = firstDaf(r), ds = r.lastDaf - first + 1, step = w / ds, gap = step >= 6 ? Math.min(3, step * .12) : 0;
      for (let d = first; d <= r.lastDaf; d++) {
        const x = x0 + (d - first) * step, e = r.dafim[d];
        if (e) { column(g, e, x, y, Math.max(1, step - gap), rh, spec.colors); count(e); }
        else { g.fillStyle = 'rgba(154,118,50,.08)'; g.fillRect(x, y, Math.max(1, step - gap), rh); }
      }
      g.fillStyle = INK; g.textAlign = 'left';
      const fs = Math.min(u * 0.3, rh * 0.42);
      g.font = `500 ${fs}px "Cormorant Garamond"`; g.fillText(r.title, m, y + rh / 2 + (rh > fs * 2.4 ? -fs * 0.15 : fs * 0.35));
      if (rh > fs * 2.4) { g.font = `500 ${fs * 0.95}px "Frank Ruhl Libre"`; g.fillText(r.he, m, y + rh / 2 + fs * 0.95); }
      g.textAlign = 'center';
      y += rh + rowGap;
    });
  }
  // legend + credit
  g.font = `400 ${u * 0.22}px "Cormorant Garamond"`; g.textAlign = 'left';
  const items = spec.order.map((k) => [k, spec.labels[k]]);
  const sw = u * 0.17, pad = u * 0.08, sep = u * 0.32;
  const widths = items.map(([, l]) => sw + pad + g.measureText(l).width);
  let yy = H - u * 1.85, off = 0;
  [items.slice(0, 5), items.slice(5)].forEach((row) => {
    const ws = widths.slice(off, off + row.length); off += row.length;
    let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + sep * (row.length - 1)) / 2;
    row.forEach(([k, l], j) => { g.fillStyle = spec.colors[k]; g.fillRect(x, yy - sw * 0.85, sw, sw); g.fillStyle = INK; g.fillText(l, x + sw + pad, yy); x += ws[j] + sep; });
    yy += u * 0.36;
  });
  g.textAlign = 'center'; g.fillStyle = GOLD; g.font = `600 ${u * 0.16}px "Cormorant SC"`;
  spaced(g, `${dafim.toLocaleString('en-US')} DAFIM · ${segs.toLocaleString('en-US')} SEGMENTS · ${sugyot.toLocaleString('en-US')} SUGYOT · EACH SEGMENT READ AND CLASSIFIED BY JEV`, W / 2, H - u * 0.92, u * 0.035);
  return { dafim, segs, sugyot };
};
window.png = () => document.getElementById('c').toDataURL('image/png');
</script></body></html>
