# Cloudflare Worker for the /pdf-to-audio prototype: speech, MP3 upload -> R2, tokenized RSS feeds.
# Deploy with: wrangler deploy   (from this directory; needs CLOUDFLARE_API_TOKEN with
# Workers Edit + R2 Edit, or `wrangler login`).
# Secrets (set once, never committed): wrangler secret put REPLICATE_API_TOKEN
#   REPLICATE_API_TOKEN — runs the Kokoro voice for POST /tts.
name = "pdf-to-audio"
main = "worker.js"
compatibility_date = "2026-11-04"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "pdf-audio"

# R2 bucket creation (once): wrangler r2 bucket create pdf-audio
