# Cloudflare Worker for the /pdf-to-audio prototype: MP3 upload -> R2, tokenized RSS feeds.
# Deploy with: wrangler deploy   (from this directory; needs CLOUDFLARE_API_TOKEN with
# Workers Edit + R2 Edit, or `wrangler login`).
# Secrets (set once, never committed): wrangler secret put UPLOAD_TOKEN
#   UPLOAD_TOKEN — shared bearer token the page sends on upload. The page reads it from
#   the URL hash (#key=...) or a manual field; it is NOT stored in the site repo.
name = "pdf-to-audio"
main = "worker.js"
compatibility_date = "2026-11-04"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "pdf-audio"

# R2 bucket creation (once): wrangler r2 bucket create pdf-audio
