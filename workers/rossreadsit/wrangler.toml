# Cloudflare Worker behind Ross Reads It (/ross). See README.md. Secrets (never committed):
#   wrangler secret put REPLICATE_API_TOKEN
#   wrangler secret put IP_SALT
name = "rossreadsit"
main = "worker.js"
compatibility_date = "2026-11-04"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "pdf-audio" # Keeps the name it had when the tool was called PDF to Audio.

[[d1_databases]]
binding = "DB"
database_name = "rossreadsit"
database_id = "09914280-1930-4d12-ac09-fe761d0dccf2"

[triggers]
crons = ["17 2 * * *"] # Clears old usage counters.
